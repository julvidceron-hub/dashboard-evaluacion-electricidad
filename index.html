    </p>

    <script>

    const SUPABASE_URL = 'https://rvoehhyvbwixudxqadug.supabase.co';

    const SUPABASE_KEY = 'sb_publishable_G2HlATMkfyHSeVE8PZCerw_VNpRicFs';

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    async function probarConexionSupabase() {

        const { data, error } = await supabaseClient
            .from('respuestas')
            .select('id')
            .limit(1);

        if (error) {

            console.error('Error de conexión con Supabase:', error);

            return;

        }

        console.log(
            'Conexión con Supabase funcionando.',
            data
        );

    }

probarConexionSupabase();

</script>
